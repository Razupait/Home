<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル共有サイト</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef2f7;
}

header{
    background:#1565c0;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.card h2{
    margin-top:0;
}

.button{
    display:inline-block;
    margin-top:15px;
    padding:12px 25px;
    background:#1976d2;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
}

.button:hover{
    background:#0d47a1;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}
</style>

</head>

<body>

<header>
<h1>📁 ファイル共有サイト</h1>
<p>必要なファイルを選んでください。</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h2>① お知らせ</h2>
<a class="button" href="files/file1.pdf" target="_blank">開く</a>
</div>

<div class="card">
<h2>② 学習資料</h2>
<a class="button" href="files/file2.pdf" target="_blank">開く</a>
</div>

<div class="card">
<h2>③ Word</h2>
<a class="button" href="files/file3.docx" target="_blank">開く</a>
</div>

<div class="card">
<h2>④ Excel</h2>
<a class="button" href="files/file4.xlsx" target="_blank">開く</a>
</div>

<div class="card">
<h2>⑤ PowerPoint</h2>
<a class="button" href="files/file5.pptx" target="_blank">開く</a>
</div>

<div class="card">
<h2>⑥ その他</h2>
<a class="button" href="files/file6.zip" target="_blank">開く</a>
</div>

</div>

</div>

<footer>
© 2026 ファイル共有サイト
</footer>

</body>
</html>
